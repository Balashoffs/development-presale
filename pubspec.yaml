name: presale
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.7.0

environment:
  sdk: ^3.9.0
flutter_localizations:
  sdk: flutter
dependencies:
  flutter:
    sdk: flutter
  flutter_localization: ^0.3.3
  csv: ^6.0.0
  go_router: ^16.2.1
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  dart_date: ^1.5.3
  flutter_svg: ^2.2.0
  syncfusion_flutter_xlsio: ^32.1.20
  syncfusion_flutter_datagrid: ^32.1.20
  syncfusion_flutter_pdf: ^32.1.20
  # storages
  path_provider: ^2.1.5
  open_file: ^3.5.10
  # generators annotation
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.4
  dartz: ^0.10.1
  hydrated_bloc: ^10.1.1
  equatable: ^2.0.7
  uuid: ^4.5.1
  provider: ^6.1.5+1
  # network
  flutter_secure_storage: ^10.0.0
  file_picker: ^10.3.3
  moon_design: ^1.1.0
  date_format: ^2.0.9
  image: ^4.8.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^3.2.0
  intl_utils: ^2.8.11
  build_runner: ^2.7.0
  json_serializable: ^6.11.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/design/
    - assets/data/template/
    - assets/data/
    - assets/


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/data/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/data/icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/data/icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/data/icon.png"